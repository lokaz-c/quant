name: CI

on:
  push:
    branches: [ main ]
  # Any base branch, so stacked PRs are tested too
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    # Same major version as docker-compose.yml. The migration tests and the API
    # tests run against it; QUANT_REQUIRE_POSTGRES makes them fail, not skip,
    # if it is unreachable.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: quant
          POSTGRES_PASSWORD: quant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U quant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      QUANT_TEST_POSTGRES_URL: postgresql://quant:quant@localhost:5432/postgres
      QUANT_REQUIRE_POSTGRES: '1'

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-live.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-live.txt

    - name: Run tests
      run: pytest --cov=backtest_engine --cov=app --cov=live_trading --ignore=tests/test_sql_metrics.py

    # sql/metrics.sql (window functions) against the Python metrics, on the
    # PostgreSQL service; see docs/sql-metrics.md
    - name: SQL cross-check
      run: pytest tests/test_sql_metrics.py

    # docs/results.md is generated; fail if the committed copy no longer matches the code
    - name: Check docs/results.md is up to date
      if: matrix.python-version == '3.11'
      run: |
        python -m scripts.results
        git diff --exit-code docs/results.md

    # Advisory until the engine is fully annotated; shows as a warning, does not fail the job
    - name: Type check (mypy, advisory)
      continue-on-error: true
      run: |
        pip install mypy
        mypy backtest_engine/ --config-file mypy.ini

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node 24
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npm run typecheck

    - name: Tests (vitest)
      run: npm test

    - name: Build
      run: npm run build
