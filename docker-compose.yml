services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: quant_db
      POSTGRES_USER: quant_user
      POSTGRES_PASSWORD: quant_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant_user -d quant_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      # Host port 8000 by default: macOS uses 5000 for AirPlay Receiver
      - "${QUANT_PORT:-8000}:5000"
    environment:
      DATABASE_URL: postgresql://quant_user:quant_pass@db:5432/quant_db
      FLASK_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    # init_db.py runs `alembic upgrade head` and seeds, once, before the workers start
    command: >
      sh -c "python init_db.py &&
             gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 300 app.main:app"

volumes:
  postgres_data:
