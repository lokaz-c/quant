name: CI

on:
  push:
    branches: [ main ]
  # Any base branch, so stacked PRs are tested too
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-live.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-live.txt

    - name: Run tests
      run: pytest --cov=backtest_engine --cov=app --cov=live_trading

    # Advisory until the engine is fully annotated; shows as a warning, does not fail the job
    - name: Type check (mypy, advisory)
      continue-on-error: true
      run: |
        pip install mypy
        mypy backtest_engine/ --config-file mypy.ini
